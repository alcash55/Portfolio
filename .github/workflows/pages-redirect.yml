# alcash55.github.io/Portfolio/ is printed on resumes. The site itself now runs
# on Cloudflare Workers, so Pages only serves a redirect page. It keeps its own
# Open Graph tags because LinkedIn's crawler cannot connect to workers.dev.
# 404.html is the same page, so old deep links land on the live site too.
name: Pages redirect

on:
  push:
    branches: ['main']
    paths:
      - 'pages-redirect/**'
      - '.github/workflows/pages-redirect.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-redirect
      - id: deployment
        uses: actions/deploy-pages@v4
