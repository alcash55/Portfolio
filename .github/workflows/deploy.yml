# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ['main']

  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

        # https://bun.sh/docs/cli/install#ci-cd
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies & build
        id: build
        run: |
          cd frontend
          bun install
          bun run build
        env:
          # Public backend base URL. Anything VITE_-prefixed is inlined into the
          # client bundle, so only non-secret values belong here. The Discord
          # webhook now lives in the backend's WEBHOOK_URL, server-side.
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Setup Pages
        id: setup_pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        id: artifact_upload
        uses: actions/upload-pages-artifact@v3
        with:
          # Vite's outDir is relative to frontend/, where the build runs
          path: './frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
