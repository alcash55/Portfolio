name: CI

on:
  pull_request:
  workflow_call:

# Reusable workflows do not inherit the caller's permissions automatically —
# they get whatever the calling job grants, capped by whatever this file asks
# for. CI only ever needs to read the repo (checkout, install, build, test),
# so it declares that explicitly rather than relying on inheritance.
permissions:
  contents: read

# Without this, three pushes to the same PR queue three full CI runs --
# lint, typecheck, unit tests, a Go build, and a Playwright install each --
# even though only the last one's result matters. Grouping per PR (falling
# back to the ref for non-PR triggers, e.g. deploy.yml's workflow_call on a
# push to main) and cancelling in-progress runs in that group means a new
# push supersedes the one before it instead of queuing behind it.
#
# cancel-in-progress is switched off for main specifically: deploy.yml
# already owns serialization for main via its own `pages` concurrency group,
# and a deploy's CI run must run to completion and gate the deploy rather
# than being cancelled out from under it by whatever triggered next.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # https://bun.sh/docs/cli/install#ci-cd
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: frontend
        run: bun install

      - name: Lint
        working-directory: frontend
        run: bun run lint

      - name: Type check
        working-directory: frontend
        run: bunx tsc --noEmit

      - name: Test
        working-directory: frontend
        run: bun run test

      - name: Build
        working-directory: frontend
        run: bun run build

  e2e:
    name: Playwright smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # https://bun.sh/docs/cli/install#ci-cd
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: frontend
        run: bun install

      - name: Type check
        working-directory: frontend
        run: bunx tsc --noEmit -p e2e/tsconfig.json

      # Keyed on bun.lockb, which pins the resolved @playwright/test version --
      # a Playwright upgrade changes the hash and busts the cache along with it,
      # so a stale browser binary can never sit alongside a newer test runner.
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('frontend/bun.lockb') }}

      # `--with-deps` also installs the OS shared libraries Chromium needs to
      # launch headless; ubuntu-latest doesn't ship them. That apt step still
      # runs on a cache hit, but it's the browser *download* (the slow, multi-
      # hundred-MB part) that the cache above is there to skip.
      - name: Install Playwright Chromium
        working-directory: frontend
        run: bunx playwright install --with-deps chromium

      # Runs against a production build via `vite preview`, not the dev
      # server -- see e2e/playwright.config.ts's webServer. A failure here is
      # a real-browser rendering/runtime bug, not a lint/type/unit-test gap,
      # so it gets its own job rather than folding into `frontend` above.
      - name: Smoke test
        working-directory: frontend
        run: bun run test:e2e

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: frontend/e2e/test-results
          retention-days: 7

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Reads the exact toolchain version from go.mod (currently 1.26.5)
          # so this stays in sync automatically instead of drifting from a
          # hardcoded version string.
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Test
        working-directory: backend
        run: go test ./... -race

      - name: Build
        working-directory: backend
        run: go build ./...
