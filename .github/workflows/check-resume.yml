name: Check Resume

on:
  workflow_dispatch:

jobs:
  check-resume:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: ATS Check
        id: ats_check
        uses: alcash55/ac-composite-actions/ats-check@main
        with:
          RESUME: ./src/assets/AlexResume.pdf

      - name: Output ATS Check Results
        run: |
          echo "ATS Check Results: ${{ steps.ats_check.outputs.summary }}"
          echo "ATS Check Details: ${{ steps.ats_check.outputs.details }}"
          echo "ATS Check Score: ${{ steps.ats_check.outputs.score }}"
          echo "ATS Check Feedback: ${{ steps.ats_check.outputs.feedback }}"
          echo "ATS Check Score: ${{ steps.ats_check.outputs.score }}"
