# Render Blueprint: https://render.com/docs/blueprint-spec
# Create via Render Dashboard -> New -> Blueprint, pointed at this repo.
services:
  - type: web
    name: portfolio-api
    runtime: docker
    plan: free
    region: ohio
    # Only redeploy when the backend actually changes.
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      # PORT is injected by Render - do not set it here.
      - key: WEBHOOK_URL
        sync: false # secret, set in the Render dashboard
      - key: GH_TOKEN
        sync: false # secret, set in the Render dashboard
      - key: RESUME_GH_TOKEN
        sync: false # secret, set in the Render dashboard - fine-grained PAT, read-only Contents access to alcash55/Resume only
      - key: GOLEM_GH_TOKEN
        sync: false # secret, set in the Render dashboard - fine-grained PAT, read-only Contents access to alcash55/Golem-Miners only
      # Optional rollback pin (a webgl-v... release tag). Leave it unset to
      # follow the newest release; set it in the dashboard, not here.
      # The production site's origin, on Cloudflare Workers. The value that runs
      # in production lives in the Render dashboard and overrides this one, so
      # keep the two in step (see README, "Changing the site URL").
      - key: ALLOWED_ORIGINS
        value: https://portfolio-website.alex-e-cash28.workers.dev
