# Render Blueprint: https://render.com/docs/blueprint-spec
# Create via Render Dashboard -> New -> Blueprint, pointed at this repo.
services:
  - type: web
    name: portfolio-api
    runtime: docker
    plan: free
    region: ohio
    # Only redeploy when the backend actually changes.
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      # PORT is injected by Render - do not set it here.
      - key: WEBHOOK_URL
        sync: false # secret, set in the Render dashboard
      - key: GH_TOKEN
        sync: false # secret, set in the Render dashboard
      - key: RESUME_GH_TOKEN
        sync: false # secret, set in the Render dashboard - fine-grained PAT, read-only Contents access to alcash55/Resume only (see scripts/resume-token-wizard.sh)
      - key: ALLOWED_ORIGINS
        value: https://alcash55.github.io
