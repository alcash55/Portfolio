<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- GitHub Pages SPA redirect decode. Pairs with public/404.html: when a
         direct hit on an unknown path bounces through 404.html, it encodes
         the original path into a query string and redirects here. This
         restores it via history.replaceState (no reload) before the app
         mounts, so React Router sees the real path and can render its own
         not-found page. https://github.com/rafgraph/spa-github-pages -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>

    <!-- Preconnect to external domains for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Viewport and theme. Both of these describe *browser-painted* UI --
         scrollbars, native form controls, and the mobile browser's own chrome
         -- so they have to match whichever of the six themes is active, not a
         fixed near-black. `ToggleColorMode` (layout/Theme/Context.tsx) rewrites
         both on mount and on every theme change; the values here are the
         pre-mount defaults, matching the default `dark` theme. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="color-scheme" content="dark" />

    <!-- Pre-paint correction for the one light theme. Without it a visitor who
         saved 'light' gets dark scrollbars and dark form controls for the frame
         or two before React mounts -- the same class of flash that made
         Theme/Context.tsx resolve its theme name synchronously rather than in
         an effect. Kept deliberately dumb: it knows only that `light` is the
         sole theme with `palette.mode: 'light'`. Add another and update this. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('theme') === 'light') {
            document.querySelector('meta[name="color-scheme"]').content = 'light';
            document.querySelector('meta[name="theme-color"]').content = '#f4f5f7';
          }
        } catch (e) {
          /* localStorage can throw in private modes; the defaults above stand. */
        }
      })();
    </script>

    <!-- Description -->
    <meta
      name="description"
      content="Portfolio of Alex Cash, a software engineer who builds clean, scalable full-stack products with React, TypeScript, and Go."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Alex Cash - Software Engineer" />
    <meta
      property="og:description"
      content="Software engineer building clean, scalable full-stack products with React, TypeScript, and Go. Explore projects, experience, and skills."
    />
    <meta property="og:url" content="https://alcash55.github.io%BASE_URL%" />
    <meta property="og:image" content="https://alcash55.github.io%BASE_URL%og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Alex Cash - Software Engineer" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Alex Cash - Software Engineer" />
    <meta
      name="twitter:description"
      content="Software engineer building clean, scalable full-stack products with React, TypeScript, and Go. Explore projects, experience, and skills."
    />
    <meta name="twitter:image" content="https://alcash55.github.io%BASE_URL%og-image.png" />

    <title>Alex Cash - Software Engineer</title>
  </head>
