<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Preconnect to external domains for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Viewport and theme -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="color-scheme" content="dark" />

    <!-- Description -->
    <meta
      name="description"
      content="Portfolio of Alex Cash, a software engineer who builds clean, scalable full-stack products with React, TypeScript, and Go."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Alex Cash - Software Engineer" />
    <meta
      property="og:description"
      content="Software engineer building clean, scalable full-stack products with React, TypeScript, and Go. Explore projects, experience, and skills."
    />
    <meta property="og:url" content="https://alcash55.github.io%BASE_URL%" />
    <meta property="og:image" content="https://alcash55.github.io%BASE_URL%og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Alex Cash - Software Engineer" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Alex Cash - Software Engineer" />
    <meta
      name="twitter:description"
      content="Software engineer building clean, scalable full-stack products with React, TypeScript, and Go. Explore projects, experience, and skills."
    />
    <meta name="twitter:image" content="https://alcash55.github.io%BASE_URL%og-image.png" />

    <!-- Structured Data for SEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Alex Cash",
        "jobTitle": "Software Engineer",
        "description": "Software Engineer specializing in web development, React, and full-stack solutions.",
        "url": "https://alcash55.github.io/Portfolio/",
        "sameAs": ["https://www.linkedin.com/in/alexander-cash/", "https://github.com/alcash55"],
        "email": "alex.e.cash28@gmail.com"
      }
    </script>

    <title>Alex Cash - Software Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
